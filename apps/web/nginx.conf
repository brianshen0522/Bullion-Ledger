server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page-app fallback so client routes resolve to index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # API proxy when co-located behind the same origin in production.
  location /api/ {
    # The API independently enforces image/PDF and per-intake quotas. Nginx
    # must allow the largest single PDF and stream it instead of buffering the
    # entire camera upload to disk first.
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
