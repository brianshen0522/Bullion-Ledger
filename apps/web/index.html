<!doctype html>
<html lang="zh-Hant" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Private, mobile-first precious-metals inventory ledger" />
    <meta name="application-name" content="Bullion Ledger" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bullion Ledger" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/bullion-ledger-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/bullion-ledger-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0f766e" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html {
        background: #f8fafc;
      }
      html.dark {
        background: #020617;
      }
    </style>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('bullion-ledger-theme');
          const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system';
          const theme =
            preference === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.dataset.displayMode =
            matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
              ? 'standalone'
              : 'browser';
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#020617' : '#f8fafc';
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#020617' : '#f8fafc';
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
            theme === 'dark' ? 'black-translucent' : 'default';
        } catch {
          // The stylesheet's prefers-color-scheme fallback remains available.
        }
      })();
    </script>
    <title>Bullion Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
