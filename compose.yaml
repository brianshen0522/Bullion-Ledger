name: bullion-ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bullion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bullion_ledger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bullion} -d ${POSTGRES_DB:-bullion_ledger}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - minio-data:/data
    networks:
      - gateway-storage
      - backend
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap. Re-runs idempotently on every compose up so a
  # fresh volume gets the private bucket and a non-public policy.
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 '${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}' '${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}' &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-bullion-ledger} &&
      mc anonymous set none local/${MINIO_BUCKET:-bullion-ledger} &&
      echo 'bucket ready (private)'
      "
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: api
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bullion}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-bullion_ledger}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-bl_session}
      SESSION_ABSOLUTE_TTL_SEC: ${SESSION_ABSOLUTE_TTL_SEC:-604800}
      SESSION_IDLE_TTL_SEC: ${SESSION_IDLE_TTL_SEC:-1800}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ALLOW_HTTP_INIT: ${ALLOW_HTTP_INIT:-}
      TRUST_PROXY_HOPS: ${GATEWAY_TRUST_PROXY_HOPS:-1}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_WINDOW_SEC: ${LOGIN_LOCKOUT_WINDOW_SEC:-900}
      ARGON_TIME_COST: ${ARGON_TIME_COST:-3}
      ARGON_MEMORY_COST: ${ARGON_MEMORY_COST:-19456}
      ARGON_PARALLELISM: ${ARGON_PARALLELISM:-1}
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_ORIGIN:-http://localhost:5173}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-bullion-ledger}
      MINIO_SIGNED_URL_TTL_SEC: ${MINIO_SIGNED_URL_TTL_SEC:-300}
      ATTACHMENT_IMAGE_MAX_BYTES: ${ATTACHMENT_IMAGE_MAX_BYTES:-26214400}
      ATTACHMENT_PDF_MAX_BYTES: ${ATTACHMENT_PDF_MAX_BYTES:-52428800}
      ATTACHMENT_INTAKE_MAX_BYTES: ${ATTACHMENT_INTAKE_MAX_BYTES:-262144000}
      ATTACHMENT_MAX_PIXELS: ${ATTACHMENT_MAX_PIXELS:-60000000}
      ATTACHMENT_DERIVATIVE_MAX_REVISIONS: ${ATTACHMENT_DERIVATIVE_MAX_REVISIONS:-20}
      ATTACHMENT_DERIVATIVE_MAX_BYTES: ${ATTACHMENT_DERIVATIVE_MAX_BYTES:-104857600}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Bullion Ledger}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-}
      PRICE_BASE_CURRENCY: ${PRICE_BASE_CURRENCY:-USD}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-TWD}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-256}
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./apps/api/prisma:/workspace/apps/api/prisma
      - ./packages/shared/src:/workspace/packages/shared/src
    networks:
      - gateway-api
      - backend
    working_dir: /workspace/apps/api
    command:
      - sh
      - -ec
      - |
        pnpm --filter @bullion-ledger/shared build
        pnpm --filter @bullion-ledger/shared dev &
        pnpm --filter @bullion-ledger/api prisma:generate
        pnpm --filter @bullion-ledger/api prisma:migrate:deploy
        pnpm --filter @bullion-ledger/api prisma:seed
        exec pnpm --filter @bullion-ledger/api dev
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Market-data queue consumer (PRD §18.5, §20.1). No HTTP port and no gateway
  # network: it reaches PostgreSQL, Redis and the public internet, nothing else.
  # It also receives no session, MinIO or WebAuthn secrets, because it has no
  # use for them.
  worker: &price-job-service
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    depends_on:
      # Waiting on a healthy API means migrations and seed have completed.
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bullion}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-bullion_ledger}?schema=public
      REDIS_URL: redis://redis:6379
      PRICE_PROVIDER: ${PRICE_PROVIDER:-}
      PRICE_BASE_CURRENCY: ${PRICE_BASE_CURRENCY:-USD}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-TWD}
      PRICE_SYNC_INTERVAL_MS: ${PRICE_SYNC_INTERVAL_MS:-300000}
      PRICE_FX_CRON: ${PRICE_FX_CRON:-}
      PRICE_HOURLY_CRON: ${PRICE_HOURLY_CRON:-}
      PRICE_DAILY_CRON: ${PRICE_DAILY_CRON:-}
      PRICE_BACKFILL_DAYS: ${PRICE_BACKFILL_DAYS:-365}
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./apps/api/prisma:/workspace/apps/api/prisma
      - ./packages/shared/src:/workspace/packages/shared/src
    networks:
      # `backend` is internal, so egress must be granted explicitly. The worker
      # is the only process that calls a third-party price API.
      - backend
      - egress
    working_dir: /workspace/apps/api
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        pnpm --filter @bullion-ledger/shared build
        pnpm --filter @bullion-ledger/api prisma:generate
        exec pnpm --filter @bullion-ledger/api dev:worker

  # Owns the repeatable job definitions (PRD §12.3). Kept separate from the
  # worker so the schedule is declared exactly once regardless of worker count.
  scheduler:
    <<: *price-job-service
    # Only enqueues; it never calls an upstream API, so it gets no egress.
    networks:
      - backend
    command:
      - sh
      - -ec
      - |
        pnpm --filter @bullion-ledger/shared build
        pnpm --filter @bullion-ledger/api prisma:generate
        exec pnpm --filter @bullion-ledger/api dev:scheduler

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./packages/shared/src:/workspace/packages/shared/src
    networks:
      - gateway-web
    working_dir: /workspace/apps/web
    command:
      - sh
      - -ec
      - |
        pnpm --filter @bullion-ledger/shared build
        pnpm --filter @bullion-ledger/shared dev &
        exec pnpm dev --host 0.0.0.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      GATEWAY_SERVER_NAME: ${GATEWAY_SERVER_NAME:-_}
      MINIO_BUCKET: ${MINIO_BUCKET:-bullion-ledger}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-256}
    ports:
      - '${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-5173}:80'
    volumes:
      - ./infra/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-web
      - gateway-api
      - gateway-storage
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/api/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  gateway-web:
  gateway-api:
  gateway-storage:
  backend:
    internal: true
  # Outbound-only network for services that must reach third-party market APIs.
  # Kept separate from `backend` so the database and Redis stay on a network
  # with no route off the host, and separate from the gateway networks so
  # nothing inbound is implied by having egress.
  egress:

volumes:
  postgres-data:
  redis-data:
  minio-data:
